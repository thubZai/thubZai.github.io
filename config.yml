          title: Yash Thube
          subtitle: "I work on making machines recover metric, physically valid world states from unconstrained visual observations. Broadly, my interests revolve around 3D/4D Computer Vision, Representation Learning, and Spatial intelligence for science and sports.<br><br>Directions shaping my thinking: Grounding latent world models with explicit physical priors, joint optimization of scenes and humans, scaling spatial foundation models for embodied control, and moving into metric, contact-rich 4D representations from 2D bounding boxes.<br><br>Currently building the core at Future Sportler (India). My day-to-day research and implementation spans multi-view geometry, inverse biomechanics/kinematics, and 4D reconstruction (HMR, 3DGS, NeRFs) to handle complex motion and physics across diverse sports and camera angles, tackling temporal segmentation under heavy occlusion, MOT, action recognition, and instruction-tuning VLMs, depth estimators, and diffusion models. Always open to collaborations!"
